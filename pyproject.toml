[project]
name = "qkd-bb84-simulator"
version = "0.1.0"
description = "BB84 quantum key distribution simulator with eavesdropping, noise and post-processing"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: Qiskit-circuit runs that take more than a few seconds",
]
